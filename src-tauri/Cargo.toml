[package]
name = "empire-at-war-browser-edition"
version = "0.1.8"
edition = "2024"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
indexmap = "2"
regex = "1"
sha2 = "0.10"
flate2 = "1"
base64 = "0.22"
percent-encoding = "2"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
lto = true
codegen-units = 1
