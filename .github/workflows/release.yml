name: Release

# A version tag builds the app for every system and publishes the release. Started by hand
# from a branch, it only builds: the apps are kept as workflow artifacts for testing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      # one system failing to build does not stop the others; the release needs Windows only
      fail-fast: false
      matrix:
        include:
          - system: windows
            runner: windows-latest
          - system: macos
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - system: linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Linux build packages
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.system }}
      - run: npm ci
      - name: Build and sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node tools/release-app.mjs build
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.system }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

  android:
    # signed with the app's release key from the repository secrets; without them the job is
    # skipped and the release goes out without an APK
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Release key
        if: env.HAS_KEY != 'true'
        run: echo "::notice::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are not set, so no Android build"
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        if: env.HAS_KEY == 'true'
        with:
          packages: platform-tools build-tools;34.0.0 ndk;${{ env.NDK_VERSION }}
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_KEY == 'true'
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_KEY == 'true'
        with:
          workspaces: src-tauri
          key: android
      - if: env.HAS_KEY == 'true'
        run: npm ci
      - name: Build and sign
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: playeaw
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE"
          node tools/release-app.mjs build --android
          rm -f "$ANDROID_KEYSTORE"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: app-android
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build, android]
    # publishes when at least the Windows build made it; a missing macOS, Linux or Android build is left out
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: dist-release/
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release-app.mjs publish
