name: Release

# A version tag builds the app for every system and publishes the release. Started by hand
# from a branch, it only builds: the apps are kept as workflow artifacts for testing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      # one system failing to build does not stop the others; the release needs Windows only
      fail-fast: false
      matrix:
        include:
          - system: windows
            runner: windows-latest
          - system: macos
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - system: linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Linux build packages
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.system }}
      - run: npm ci
      - name: Build and sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node tools/release-app.mjs build
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.system }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    # publishes when at least the Windows build made it; a missing macOS or Linux build is left out
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: dist-release/
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release-app.mjs publish
